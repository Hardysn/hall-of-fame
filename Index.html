<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hall of Fame - Retas PvP</title>
  
  <!-- Cargar librería de Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg-color: #0f0f12;
      --card-bg: linear-gradient(145deg, #1e1e24, #2a2a35);
      --accent-color: #ffca28;
      --text-color: #ffffff;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    h1 {
      color: var(--accent-color);
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .btn-primary {
      background-color: var(--accent-color);
      color: #000;
      border: none;
      padding: 10px 20px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.2s;
      margin-top: 10px;
    }

    .btn-primary:hover {
      transform: scale(1.05);
    }

    .cards-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 30px;
      justify-content: center;
      max-width: 1200px;
      width: 100%;
    }

    .card-container {
      width: 290px;
      height: 450px;
      perspective: 1000px;
    }

    .card {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.6);
    }

    .card.flipped {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 16px;
      box-sizing: border-box;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      border: 2px solid #333;
      background: var(--card-bg);
    }

    .game-title {
      font-size: 1.3rem;
      font-weight: bold;
      text-transform: uppercase;
      color: var(--accent-color);
      margin: 0;
      text-align: center;
    }

    .trophy-container {
      width: 140px;
      height: 140px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }

    .trophy-img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .champion-box {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--accent-color);
      border-radius: 8px;
      width: 100%;
      padding: 10px;
      text-align: center;
      box-sizing: border-box;
    }

    .champion-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      color: #aaa;
    }

    .champion-name {
      font-size: 1.2rem;
      font-weight: bold;
      color: #fff;
      margin-top: 4px;
    }

    .card-actions {
      display: flex;
      gap: 8px;
      width: 100%;
    }

    .btn-action {
      flex: 1;
      padding: 8px 5px;
      font-size: 0.8rem;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      text-align: center;
    }

    .btn-win {
      background-color: #2e7d32;
      color: #fff;
    }

    .btn-win:hover {
      background-color: #388e3c;
    }

    .btn-flip {
      background-color: #444;
      color: #fff;
    }

    .card-back {
      transform: rotateY(180deg);
      align-items: flex-start;
      overflow-y: auto;
    }

    .back-title {
      font-size: 1rem;
      color: var(--accent-color);
      border-bottom: 1px solid #444;
      width: 100%;
      padding-bottom: 4px;
      margin-top: 10px;
      margin-bottom: 8px;
    }

    .stats-list {
      width: 100%;
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .stats-item {
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
      font-size: 0.85rem;
      border-bottom: 1px dotted #333;
    }

    .records-box {
      width: 100%;
      background: rgba(0,0,0,0.3);
      padding: 8px;
      border-radius: 6px;
      box-sizing: border-box;
      margin-bottom: 10px;
    }

    .record-text {
      font-size: 0.8rem;
      color: #ddd;
      margin: 3px 0;
    }

    /* Modal / Formulario */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .modal-content {
      background: #1e1e24;
      padding: 25px;
      border-radius: 12px;
      width: 90%;
      max-width: 400px;
      border: 1px solid var(--accent-color);
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      margin-bottom: 5px;
      color: #aaa;
    }

    .form-group input, .form-group textarea, .form-group select {
      width: 100%;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #444;
      background: #0f0f12;
      color: #fff;
      box-sizing: border-box;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .btn-secondary {
      background: #444;
      color: #fff;
      border: none;
      padding: 8px 15px;
      border-radius: 6px;
      cursor: pointer;
    }

    .btn-danger {
      background: #c62828;
      color: #fff;
      border: none;
      padding: 8px 15px;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <h1>🏆 Hall of Fame PvP</h1>
    <p>Registro oficial de campeones y récords</p>
    <button class="btn-primary" onclick="openGameModal()">+ Agregar Juego</button>
  </header>

  <main class="cards-grid" id="cardsGrid">
    <p style="color: #aaa;">Cargando tarjetas desde la nube...</p>
  </main>

  <!-- Modal para Agregar/Editar Juego -->
  <div class="modal" id="gameModal">
    <div class="modal-content">
      <h2 style="color: var(--accent-color); margin-top:0;" id="modalTitle">Nuevo Juego</h2>
      <input type="hidden" id="editGameId">
      <div class="form-group">
        <label>Nombre del Juego</label>
        <input type="text" id="inputTitle" placeholder="Ej. Mario Party">
      </div>
      <div class="form-group">
        <label>URL del dibujo del Trofeo</label>
        <input type="text" id="inputTrophy" placeholder="Ej. https://i.imgur.com/tu_imagen.png">
      </div>
      <div class="form-group">
        <label>Campeón Inicial</label>
        <input type="text" id="inputChampion" placeholder="Ej. Juan">
      </div>
      <div class="form-group">
        <label>Historial Inicial (Ej: Juan: 5, Pedro: 3)</label>
        <input type="text" id="inputHistory" placeholder="Juan: 5, Pedro: 3">
      </div>
      <div class="form-group">
        <label>Récord Destacado</label>
        <textarea id="inputRecord" rows="2" placeholder="Ej. 10 Estrellas acumuladas por Juan"></textarea>
      </div>
      <div class="modal-actions">
        <button class="btn-secondary" onclick="closeGameModal()">Cancelar</button>
        <button class="btn-primary" id="btnSave" onclick="saveGame()">Guardar</button>
      </div>
    </div>
  </div>

  <!-- Modal para Registrar Ganador -->
  <div class="modal" id="winModal">
    <div class="modal-content">
      <h2 style="color: var(--accent-color); margin-top:0;">🏆 Registrar Victoria</h2>
      <p id="winGameTitle" style="color: #aaa; margin-top: -10px; font-size: 0.9rem;"></p>
      <input type="hidden" id="winGameId">
      
      <div class="form-group">
        <label>¿Quién ganó la reta?</label>
        <input type="text" id="winPlayerName" placeholder="Escribe el nombre del ganador">
      </div>
      
      <div class="form-group">
        <label>Nuevo Récord o Momento Destacado (Opcional)</label>
        <textarea id="winRecordText" rows="2" placeholder="Ej. Le ganó en el último segundo con 1 HP"></textarea>
      </div>

      <div class="modal-actions">
        <button class="btn-secondary" onclick="closeWinModal()">Cancelar</button>
        <button class="btn-primary" id="btnSaveWin" onclick="processWinner()">🚀 Confirmar Victoria</button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://fzqwqjobubwccaiyoqrg.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ6cXdxam9idWJ3Y2NhaXlvcXJnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1MzE2MDIsImV4cCI6MjEwNDEwNzYwMn0.AEE6KK2uRsKx4YoLD_uPU-jkx2w9Enz8ZQcq9pPPpwg';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentGamesData = [];

    async function loadGames() {
      const grid = document.getElementById('cardsGrid');
      
      const { data, error } = await supabaseClient
        .from('pvp_cards')
        .select('*')
        .order('created_at', { ascending: true });

      if (error) {
        console.error('Error al cargar juegos:', error);
        grid.innerHTML = '<p style="color: #ff5555;">Error al cargar las tarjetas desde la nube.</p>';
        return;
      }

      currentGamesData = data || [];

      if (currentGamesData.length === 0) {
        grid.innerHTML = '<p style="color: #aaa;">No hay tarjetas creadas aún. ¡Haz clic en "+ Agregar Juego"!</p>';
        return;
      }

      grid.innerHTML = '';

      currentGamesData.forEach(game => {
        const historyList = Array.isArray(game.history) ? game.history : [];
        
        const cardHtml = `
          <div class="card-container">
            <div class="card" id="card-${game.id}">
              
              <!-- FRENTE -->
              <div class="card-face">
                <h2 class="game-title">${game.title}</h2>
                <div class="trophy-container" onclick="toggleFlip('${game.id}')">
                  <img src="${game.trophy || 'https://via.placeholder.com/150/FFD700/000000?text=TROFEO'}" alt="Trofeo" class="trophy-img" onerror="this.src='https://via.placeholder.com/150/FFD700/000000?text=TROFEO'">
                </div>
                <div class="champion-box">
                  <div class="champion-label">Campeón Actual</div>
                  <div class="champion-name">👑 ${game.champion || 'Sin definir'}</div>
                </div>

                <div class="card-actions">
                  <button class="btn-action btn-win" onclick="openWinModal('${game.id}')">🏆 Victoria</button>
                  <button class="btn-action btn-flip" onclick="toggleFlip('${game.id}')">🔄 Ver Info</button>
                </div>
              </div>

              <!-- REVERSO -->
              <div class="card-face card-back">
                <div class="back-title">Historial de Victorias</div>
                <ul class="stats-list">
                  ${historyList.map(item => `<li class="stats-item"><span>${item.name}</span> <strong>${item.wins} victorias</strong></li>`).join('')}
                </ul>

                <div class="back-title">Récord Memorable</div>
                <div class="records-box">
                  <p class="record-text">${game.record || 'Sin récords registrados aún'}</p>
                </div>

                <div class="card-actions" style="margin-top: auto;">
                  <button class="btn-action btn-secondary" onclick="deleteGame('${game.id}')" style="background:#c62828;">Eliminar</button>
                  <button class="btn-action btn-flip" onclick="toggleFlip('${game.id}')">🔄 Voltear</button>
                </div>
              </div>

            </div>
          </div>
        `;
        grid.innerHTML += cardHtml;
      });
    }

    function toggleFlip(id) {
      const card = document.getElementById(`card-${id}`);
      if (card) card.classList.toggle('flipped');
    }

    /* Modal Nuevo/Editar Juego */
    function openGameModal() {
      document.getElementById('modalTitle').innerText = 'Nuevo Juego';
      document.getElementById('editGameId').value = '';
      document.getElementById('inputTitle').value = '';
      document.getElementById('inputTrophy').value = '';
      document.getElementById('inputChampion').value = '';
      document.getElementById('inputHistory').value = '';
      document.getElementById('inputRecord').value = '';
      document.getElementById('gameModal').style.display = 'flex';
    }

    function closeGameModal() {
      document.getElementById('gameModal').style.display = 'none';
    }

    async function saveGame() {
      const btnSave = document.getElementById('btnSave');
      const title = document.getElementById('inputTitle').value;
      const trophy = document.getElementById('inputTrophy').value;
      const champion = document.getElementById('inputChampion').value;
      const historyRaw = document.getElementById('inputHistory').value;
      const record = document.getElementById('inputRecord').value;

      if (!title) return alert('Por favor escribe el nombre del juego');

      btnSave.innerText = 'Guardando...';
      btnSave.disabled = true;

      let history = [];
      if (historyRaw) {
        history = historyRaw.split(',').map(item => {
          const [name, wins] = item.split(':');
          return { name: name ? name.trim() : 'Jugador', wins: wins ? parseInt(wins.trim()) || 0 : 0 };
        });
      }

      const { error } = await supabaseClient
        .from('pvp_cards')
        .insert([{
          title,
          trophy: trophy || 'https://via.placeholder.com/150/FFD700/000000?text=TROFEO',
          champion: champion || 'Por definir',
          history,
          record
        }]);

      btnSave.innerText = 'Guardar';
      btnSave.disabled = false;

      if (error) {
        console.error('Error al guardar:', error);
        alert('Hubo un error al guardar la tarjeta.');
      } else {
        closeGameModal();
        loadGames();
      }
    }

    /* Modal Registrar Victoria Automática */
    function openWinModal(id) {
      const game = currentGamesData.find(g => g.id === id);
      if (!game) return;

      document.getElementById('winGameId').value = id;
      document.getElementById('winGameTitle').innerText = `Juego: ${game.title}`;
      document.getElementById('winPlayerName').value = '';
      document.getElementById('winRecordText').value = game.record || '';
      document.getElementById('winModal').style.display = 'flex';
    }

    function closeWinModal() {
      document.getElementById('winModal').style.display = 'none';
    }

    async function processWinner() {
      const id = document.getElementById('winGameId').value;
      const winnerName = document.getElementById('winPlayerName').value.trim();
      const newRecord = document.getElementById('winRecordText').value.trim();
      const btnSaveWin = document.getElementById('btnSaveWin');

      if (!winnerName) return alert('Por favor escribe el nombre del ganador.');

      btnSaveWin.innerText = 'Actualizando...';
      btnSaveWin.disabled = true;

      const game = currentGamesData.find(g => g.id === id);
      let history = Array.isArray(game.history) ? [...game.history] : [];

      // Buscar si el jugador ya está en el historial
      const playerIndex = history.findIndex(h => h.name.toLowerCase() === winnerName.toLowerCase());

      if (playerIndex >= 0) {
        history[playerIndex].wins = (parseInt(history[playerIndex].wins) || 0) + 1;
      } else {
        history.push({ name: winnerName, wins: 1 });
      }

      // Ordenar historial por número de victorias (de mayor a menor)
      history.sort((a, b) => b.wins - a.wins);

      // Actualizar en Supabase
      const { error } = await supabaseClient
        .from('pvp_cards')
        .update({
          champion: winnerName,
          history: history,
          record: newRecord
        })
        .eq('id', id);

      btnSaveWin.innerText = '🚀 Confirmar Victoria';
      btnSaveWin.disabled = false;

      if (error) {
        console.error('Error al actualizar victoria:', error);
        alert('Hubo un error al actualizar la victoria.');
      } else {
        closeWinModal();
        loadGames();
      }
    }

    async function deleteGame(id) {
      if (!confirm('¿Seguro que quieres eliminar este juego?')) return;

      const { error } = await supabaseClient
        .from('pvp_cards')
        .delete()
        .eq('id', id);

      if (error) {
        alert('Error al eliminar');
      } else {
        loadGames();
      }
    }

    loadGames();
  </script>
</body>
</html>
