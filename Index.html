<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Torneo PvP - Dashboard</title>
  
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg-color: #0f0f18;
      --card-bg: #1a1a27;
      --accent-gold: #ffca28;
      --accent-blue: #0288d1;
      --text-main: #ffffff;
      --text-muted: #a0a0b0;
      --border-color: rgba(255, 255, 255, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 20px;
    }

    /* HEADER Y CONTROLES */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      padding-bottom: 15px;
      border-bottom: 1px solid var(--border-color);
      flex-wrap: wrap;
      gap: 15px;
    }

    h1 {
      font-size: 1.8rem;
      color: var(--accent-gold);
    }

    .btn-action {
      background: var(--accent-gold);
      color: #000;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s, background 0.2s;
    }

    .btn-action:hover {
      transform: translateY(-2px);
      filter: brightness(1.1);
    }

    .btn-secondary {
      background: #333348;
      color: white;
    }

    .btn-win {
      background: #2e7d32;
      color: white;
    }

    /* SECCIÓN DE JUGADORES */
    .section-title {
      font-size: 1.2rem;
      margin-bottom: 12px;
      color: var(--text-muted);
    }

    .players-bar {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 10px;
      margin-bottom: 25px;
    }

    .player-card-item {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 8px 14px;
      border-radius: 30px;
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: max-content;
      transition: border-color 0.2s;
    }

    .player-card-item:hover {
      border-color: var(--accent-gold);
    }

    .player-avatar-small {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--accent-gold);
    }

    /* GRID DE JUEGOS */
    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .game-card {
      background: var(--card-bg);
      border-radius: 12px;
      border: 1px solid var(--border-color);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .game-banner {
      width: 100%;
      height: 140px;
      object-fit: cover;
      background-color: #252538;
    }

    .game-content {
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex-grow: 1;
    }

    .game-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .trophy-img {
      width: 35px;
      height: 35px;
      object-fit: contain;
    }

    .champion-box {
      background: rgba(255, 202, 40, 0.1);
      border: 1px dashed var(--accent-gold);
      padding: 8px;
      border-radius: 8px;
      text-align: center;
    }

    .champion-name {
      color: var(--accent-gold);
      font-weight: bold;
      font-size: 1.1rem;
    }

    /* MODALES GENERALES */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-content {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      width: 90%;
      max-width: 500px;
      position: relative;
    }

    .modal-close {
      position: absolute;
      top: 12px; right: 15px;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.2rem;
      cursor: pointer;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .form-control {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--border-color);
      color: white;
    }

    /* ESTILOS DE LA TARJETA ID DE JUGADOR */
    .player-id-card {
      background: linear-gradient(145deg, #1e1e2f, #12121c);
      border: 2px solid var(--accent-gold);
      border-radius: 16px;
      box-shadow: 0 0 20px rgba(255, 202, 40, 0.3);
      max-width: 420px;
      width: 90%;
    }

    .id-header {
      text-align: center;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 10px;
      margin-bottom: 15px;
    }

    .id-badge {
      background: var(--accent-gold);
      color: #000;
      font-size: 0.65rem;
      font-weight: 900;
      padding: 2px 8px;
      border-radius: 4px;
      letter-spacing: 1.5px;
    }

    .id-header h3 {
      margin: 8px 0 0 0;
      font-size: 1.4rem;
      color: #fff;
    }

    .id-body {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    .id-avatar-img {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--accent-gold);
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }

    .id-trophies-section {
      width: 100%;
    }

    .id-trophies-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 10px;
      max-height: 180px;
      overflow-y: auto;
      padding-right: 5px;
    }

    .id-trophy-item {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      padding: 8px;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .id-trophy-img {
      width: 40px;
      height: 40px;
      object-fit: contain;
    }

    .id-trophy-count {
      font-size: 0.75rem;
      font-weight: bold;
      color: var(--accent-gold);
      margin-top: 4px;
    }

    .id-actions {
      margin-top: 15px;
      display: flex;
      justify-content: center;
    }
  </style>
</head>
<body>

  <header>
    <h1>🏆 Torneo PvP</h1>
    <div style="display: flex; gap: 10px;">
      <button class="btn-action btn-secondary" onclick="openAddPlayerModal()">+ Agregar Jugador</button>
      <button class="btn-action" onclick="openAddGameModal()">+ Agregar Juego</button>
    </div>
  </header>

  <!-- JUGADORES -->
  <h2 class="section-title">JUGADORES REGISTRADOS (Haz clic para ver ID)</h2>
  <div id="playersListContainer" class="players-bar">
    <p style="color: #aaa; font-size: 0.85rem;">Cargando jugadores...</p>
  </div>

  <!-- TARJETAS DE JUEGOS -->
  <h2 class="section-title">TARJETAS DE JUEGOS</h2>
  <div id="gamesGridContainer" class="games-grid">
    <p style="color: #aaa; font-size: 0.85rem;">Cargando juegos...</p>
  </div>

  <!-- MODAL: AGREGAR JUGADOR -->
  <div class="modal-overlay" id="addPlayerModal" style="display:none;">
    <div class="modal-content">
      <button class="modal-close" onclick="closeAddPlayerModal()">✕</button>
      <h3>Registrar Nuevo Jugador</h3>
      <div class="form-group" style="margin-top: 15px;">
        <label>Nombre del Jugador</label>
        <input type="text" id="newPlayerNameInput" class="form-control" placeholder="Ej: Alex">
      </div>
      <div class="form-group">
        <label>URL o Nombre de Archivo de Avatar</label>
        <input type="text" id="newPlayerAvatarInput" class="form-control" placeholder="Ej: alex.jpg o https://...">
      </div>
      <button class="btn-action" onclick="saveNewPlayer()" style="width: 100%; margin-top: 10px;">Guardar Jugador</button>
    </div>
  </div>

  <!-- MODAL: AGREGAR JUEGO -->
  <div class="modal-overlay" id="addGameModal" style="display:none;">
    <div class="modal-content">
      <button class="modal-close" onclick="closeAddGameModal()">✕</button>
      <h3>Agregar Nuevo Juego</h3>
      <div class="form-group" style="margin-top: 15px;">
        <label>Título del Juego</label>
        <input type="text" id="newGameTitleInput" class="form-control" placeholder="Ej: Street Fighter VI">
      </div>
      <div class="form-group">
        <label>URL o Nombre de Archivo de la Portada/Banner</label>
        <input type="text" id="newGameBannerInput" class="form-control" placeholder="Ej: sf6.png o https://...">
      </div>
      <div class="form-group">
        <label>URL o Nombre de Archivo del Trofeo</label>
        <input type="text" id="newGameTrophyInput" class="form-control" placeholder="Ej: trophy.png o https://...">
      </div>
      <button class="btn-action" onclick="saveNewGame()" style="width: 100%; margin-top: 10px;">Guardar Juego</button>
    </div>
  </div>

  <!-- MODAL: ID / PERFIL DE JUGADOR -->
  <div class="modal-overlay" id="playerProfileModal" style="display:none;">
    <div class="modal-content player-id-card">
      <button class="modal-close" onclick="closePlayerProfileModal()">✕</button>
      
      <div class="id-header">
        <span class="id-badge">PLAYER ID</span>
        <h3 id="idPlayerName">Nombre del Jugador</h3>
      </div>

      <div class="id-body">
        <div class="id-avatar-container">
          <img id="idPlayerAvatar" src="" alt="Avatar" class="id-avatar-img">
        </div>
        
        <div class="id-trophies-section">
          <h4 style="margin-bottom: 8px; color: var(--accent-gold); font-size: 0.9rem;">🏆 TROFEOS OBTENIDOS</h4>
          <div id="idPlayerTrophies" class="id-trophies-grid">
            <!-- Cargado dinámicamente -->
          </div>
        </div>
      </div>

      <div class="id-actions">
        <button class="btn-action" onclick="openEditPlayerModal()" style="background: var(--accent-blue); color: white;">✏️ Editar Perfil</button>
      </div>
    </div>
  </div>

  <!-- MODAL: EDITAR JUGADOR -->
  <div class="modal-overlay" id="editPlayerModal" style="display:none;">
    <div class="modal-content">
      <h3>Editar Jugador</h3>
      <input type="hidden" id="editPlayerId">
      
      <div class="form-group" style="margin-top: 15px;">
        <label>Nombre</label>
        <input type="text" id="editPlayerNameInput" class="form-control">
      </div>
      <div class="form-group">
        <label>URL / Archivo de Avatar</label>
        <input type="text" id="editPlayerAvatarInput" class="form-control">
      </div>

      <div style="display:flex; gap:10px; justify-content:flex-end; margin-top:15px;">
        <button class="btn-action btn-secondary" onclick="closeEditPlayerModal()">Cancelar</button>
        <button class="btn-action btn-win" onclick="savePlayerChanges()">Guardar</button>
      </div>
    </div>
  </div>

  <script>
    // ----------------------------------------------------
    // CONFIGURACIÓN DE SUPABASE
    // (Asegúrate de colocar tus credenciales)
    // ----------------------------------------------------
    const SUPABASE_URL = 'https://TU-PROYECTO.supabase.co';
    const SUPABASE_ANON_KEY = 'TU-ANON-KEY';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // BUCKET DE IMÁGENES (Opcional, si usas Supabase Storage)
    const STORAGE_BUCKET = 'pvp-images';

    // VARIABLES GLOBALES
    let currentPlayersData = [];
    let currentGamesData = [];
    let selectedPlayerForId = null;

    // Helper para formatear URLs de imágenes
    function getImageUrl(path) {
      if (!path) return '';
      if (path.startsWith('http://') || path.startsWith('https://')) {
        return path;
      }
      return `${SUPABASE_URL}/storage/v1/object/public/${STORAGE_BUCKET}/${path}`;
    }

    // ----------------------------------------------------
    // CARGAR DATOS DESDE SUPABASE
    // ----------------------------------------------------
    async function loadPlayers() {
      const { data, error } = await supabaseClient.from('players').select('*');
      if (error) {
        console.error('Error al cargar jugadores:', error);
        return;
      }
      currentPlayersData = data || [];
      renderPlayersList();
    }

    async function loadGames() {
      const { data, error } = await supabaseClient.from('pvp_cards').select('*');
      if (error) {
        console.error('Error al cargar juegos:', error);
        return;
      }
      currentGamesData = data || [];
      renderGamesGrid();
    }

    // ----------------------------------------------------
    // RENDERIZADO
    // ----------------------------------------------------
    function renderPlayersList() {
      const container = document.getElementById('playersListContainer');
      if (!container) return;

      if (currentPlayersData.length === 0) {
        container.innerHTML = '<p style="color: #aaa; font-size: 0.85rem;">No hay jugadores registrados aún.</p>';
        return;
      }

      container.innerHTML = currentPlayersData.map(p => {
        const avatarSrc = getImageUrl(p.avatar_url) || 'https://via.placeholder.com/150/FFD700/000000?text=USER';
        return `
          <div class="player-card-item">
            <div class="player-info" onclick="openPlayerProfileModal('${p.id}')" style="cursor: pointer; display: flex; align-items: center; gap: 8px;">
              <img src="${avatarSrc}" class="player-avatar-small" onerror="this.src='https://via.placeholder.com/150/FFD700/000000?text=USER'">
              <span style="font-weight: 700;">${p.name}</span>
            </div>
            <button onclick="deletePlayer('${p.id}')" style="background: none; border: none; color: #ff5555; cursor: pointer; margin-left: 5px;">🗑️</button>
          </div>
        `;
      }).join('');
    }

    function renderGamesGrid() {
      const container = document.getElementById('gamesGridContainer');
      if (!container) return;

      if (currentGamesData.length === 0) {
        container.innerHTML = '<p style="color: #aaa; font-size: 0.85rem;">No hay tarjetas de juegos registradas.</p>';
        return;
      }

      container.innerHTML = currentGamesData.map(g => {
        const bannerSrc = getImageUrl(g.banner) || 'https://via.placeholder.com/400x150/1a1a27/FFFFFF?text=PVP+GAME';
        const trophySrc = getImageUrl(g.trophy) || 'https://via.placeholder.com/100/FFD700/000000?text=TROFEO';
        
        return `
          <div class="game-card">
            <img src="${bannerSrc}" class="game-banner" onerror="this.src='https://via.placeholder.com/400x150/1a1a27/FFFFFF?text=PVP+GAME'">
            <div class="game-content">
              <div class="game-header">
                <h3>${g.title}</h3>
                <img src="${trophySrc}" class="trophy-img" onerror="this.src='https://via.placeholder.com/100/FFD700/000000?text=TROFEO'">
              </div>
              <div class="champion-box">
                <div style="font-size: 0.75rem; color: #a0a0b0;">CAMPEÓN ACTUAL</div>
                <div class="champion-name">${g.champion || 'Sin Campeón'}</div>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    // ----------------------------------------------------
    // LÓGICA DE ID / PERFIL Y EDICIÓN DE JUGADOR
    // ----------------------------------------------------
    function openPlayerProfileModal(playerId) {
      const player = currentPlayersData.find(p => p.id === playerId);
      if (!player) return;

      selectedPlayerForId = player;

      document.getElementById('idPlayerName').innerText = player.name;
      document.getElementById('idPlayerAvatar').src = getImageUrl(player.avatar_url) || 'https://via.placeholder.com/150/FFD700/000000?text=USER';

      // Buscar todos los trofeos ganados en el historial de los juegos
      const trophiesContainer = document.getElementById('idPlayerTrophies');
      let playerTrophies = [];

      currentGamesData.forEach(game => {
        const history = Array.isArray(game.history) ? game.history : [];
        const record = history.find(h => h.name && h.name.toLowerCase() === player.name.toLowerCase());
        
        if (record && record.wins > 0) {
          playerTrophies.push({
            gameTitle: game.title,
            trophyImg: getImageUrl(game.trophy),
            wins: record.wins
          });
        }
      });

      if (playerTrophies.length === 0) {
        trophiesContainer.innerHTML = '<p style="color: #aaa; font-size: 0.8rem; grid-column: 1/-1;">Aún no ha registrado victorias.</p>';
      } else {
        trophiesContainer.innerHTML = playerTrophies.map(t => `
          <div class="id-trophy-item">
            <img src="${t.trophyImg || 'https://via.placeholder.com/150/FFD700/000000?text=TROFEO'}" class="id-trophy-img" title="${t.gameTitle}">
            <div style="font-size: 0.7rem; color:#fff; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${t.gameTitle}</div>
            <div class="id-trophy-count">🏆 x${t.wins}</div>
          </div>
        `).join('');
      }

      document.getElementById('playerProfileModal').style.display = 'flex';
    }

    function closePlayerProfileModal() {
      document.getElementById('playerProfileModal').style.display = 'none';
    }

    function openEditPlayerModal() {
      if (!selectedPlayerForId) return;
      
      document.getElementById('editPlayerId').value = selectedPlayerForId.id;
      document.getElementById('editPlayerNameInput').value = selectedPlayerForId.name;
      document.getElementById('editPlayerAvatarInput').value = selectedPlayerForId.avatar_url || '';
      
      document.getElementById('editPlayerModal').style.display = 'flex';
    }

    function closeEditPlayerModal() {
      document.getElementById('editPlayerModal').style.display = 'none';
    }

    async function savePlayerChanges() {
      const id = document.getElementById('editPlayerId').value;
      const newName = document.getElementById('editPlayerNameInput').value.trim();
      const newAvatar = document.getElementById('editPlayerAvatarInput').value.trim();

      if (!newName) return alert('El nombre no puede estar vacío.');

      const oldName = selectedPlayerForId ? selectedPlayerForId.name : null;

      const { error } = await supabaseClient
        .from('players')
        .update({ name: newName, avatar_url: newAvatar })
        .eq('id', id);

      if (error) {
        console.error('Error al actualizar jugador:', error);
        alert('Hubo un error al actualizar el jugador.');
        return;
      }

      // Si el nombre cambió, actualizarlo en las tarjetas pvp_cards (campeones e historiales)
      if (oldName && oldName !== newName) {
        for (let game of currentGamesData) {
          let updated = false;
          let newChampion = game.champion;
          let newHistory = Array.isArray(game.history) ? [...game.history] : [];

          if (game.champion && game.champion.toLowerCase() === oldName.toLowerCase()) {
            newChampion = newName;
            updated = true;
          }

          newHistory = newHistory.map(h => {
            if (h.name && h.name.toLowerCase() === oldName.toLowerCase()) {
              updated = true;
              return { ...h, name: newName };
            }
            return h;
          });

          if (updated) {
            await supabaseClient
              .from('pvp_cards')
              .update({ champion: newChampion, history: newHistory })
              .eq('id', game.id);
          }
        }
      }

      closeEditPlayerModal();
      closePlayerProfileModal();
      await loadPlayers();
      await loadGames();
    }

    async function deletePlayer(id) {
      if (!confirm('¿Seguro que deseas eliminar este jugador?')) return;
      const { error } = await supabaseClient.from('players').delete().eq('id', id);
      if (error) {
        console.error('Error al eliminar jugador:', error);
        alert('Error al eliminar el jugador.');
      } else {
        await loadPlayers();
      }
    }

    // ----------------------------------------------------
    // AGREGAR JUGADOR / JUEGO
    // ----------------------------------------------------
    function openAddPlayerModal() { document.getElementById('addPlayerModal').style.display = 'flex'; }
    function closeAddPlayerModal() { document.getElementById('addPlayerModal').style.display = 'none'; }
    function openAddGameModal() { document.getElementById('addGameModal').style.display = 'flex'; }
    function closeAddGameModal() { document.getElementById('addGameModal').style.display = 'none'; }

    async function saveNewPlayer() {
      const name = document.getElementById('newPlayerNameInput').value.trim();
      const avatar_url = document.getElementById('newPlayerAvatarInput').value.trim();

      if (!name) return alert('Por favor escribe un nombre.');

      const { error } = await supabaseClient.from('players').insert([{ name, avatar_url }]);
      if (error) {
        console.error('Error al crear jugador:', error);
        alert('Hubo un error al guardar el jugador.');
      } else {
        document.getElementById('newPlayerNameInput').value = '';
        document.getElementById('newPlayerAvatarInput').value = '';
        closeAddPlayerModal();
        await loadPlayers();
      }
    }

    async function saveNewGame() {
      const title = document.getElementById('newGameTitleInput').value.trim();
      const banner = document.getElementById('newGameBannerInput').value.trim();
      const trophy = document.getElementById('newGameTrophyInput').value.trim();

      if (!title) return alert('Por favor escribe un título.');

      const { error } = await supabaseClient.from('pvp_cards').insert([{
        title,
        banner,
        trophy,
        champion: null,
        history: []
      }]);

      if (error) {
        console.error('Error al crear juego:', error);
        alert('Hubo un error al guardar el juego.');
      } else {
        document.getElementById('newGameTitleInput').value = '';
        document.getElementById('newGameBannerInput').value = '';
        document.getElementById('newGameTrophyInput').value = '';
        closeAddGameModal();
        await loadGames();
      }
    }

    // Inicializar datos al cargar la página
    window.addEventListener('DOMContentLoaded', () => {
      loadPlayers();
      loadGames();
    });
  </script>
</body>
</html>
